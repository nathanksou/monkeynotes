<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#323437" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>monkeynotes</title>
  </head>
  <body>
    <div id="app">
      <button id="sidebar-toggle" class="icon" title="show / hide folders (ctrl+\)" aria-label="show or hide folders"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/><path d="M3.3 5h1M3.3 7h1M3.3 9h1"/></svg></button>
      <aside id="folders" class="pane">
        <header class="pane-head">
          <span class="brand"><span class="accent">monkey</span>notes</span>
        </header>
        <ul id="folder-list" class="list"></ul>
        <div class="resize-handle" data-pane="folders" title="drag to resize · double-click to reset"></div>
        <div class="pane-foot">
          <button id="new-folder" class="ghost" title="new folder (ctrl+shift+n)">+ new folder</button>
        </div>
      </aside>

      <section id="notes" class="pane">
        <header class="pane-head">
          <span id="notes-title"></span>
          <span class="pane-actions">
            <span class="view-switch" role="group" aria-label="view">
              <button class="icon js-view" data-view="list" title="list view (ctrl+1)" aria-label="list view"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4h8M5.5 8h8M5.5 12h8"/><path d="M2.5 4h.5M2.5 8h.5M2.5 12h.5"/></svg></button>
              <button class="icon js-view" data-view="grid" title="gallery view (ctrl+2)" aria-label="gallery view"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg></button>
            </span>
            <button class="icon js-new-note" title="new note (ctrl+n)" aria-label="new note"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
          </span>
        </header>
        <div class="search-wrap">
          <input id="search" type="text" placeholder="search" spellcheck="false" autocomplete="off" />
        </div>
        <ul id="note-list" class="list"></ul>
        <div class="trash-foot" hidden><span>notes here are deleted for good after 30 days</span><button class="ghost danger js-empty-trash">delete all forever</button></div>
        <div class="resize-handle" data-pane="notes" title="drag to resize · double-click to reset"></div>
      </section>

      <main id="main">
        <div id="topbar">
          <span class="topbar-left">
            <button id="back-to-gallery" class="icon" title="back to gallery" aria-label="back to gallery"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
          </span>
          <button id="open-palette" class="ghost" title="command line (esc)">esc</button>
        </div>
        <div id="find" hidden>
          <input type="text" placeholder="find in note" spellcheck="false" autocomplete="off" />
          <span class="find-count"></span>
          <button class="find-prev ghost" title="previous (shift+enter)">&uarr;</button>
          <button class="find-next ghost" title="next (enter)">&darr;</button>
          <button class="find-close ghost" title="close (esc)">&times;</button>
        </div>
        <div id="scroller">
          <div id="page">
            <div id="wrap">
              <div id="decor" class="text" aria-hidden="true"></div>
              <div id="highlights" class="text" aria-hidden="true"></div>
              <textarea id="editor" class="text" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="note"></textarea>
              <div class="mirror text" aria-hidden="true"></div>
              <div class="caret hidden smooth"></div>
              <div id="fx" aria-hidden="true"></div>
            </div>
            <div class="empty-hint">no note selected · <kbd>ctrl</kbd> + <kbd>n</kbd> to start one</div>
          </div>
        </div>
        <section id="gallery" aria-label="gallery">
          <header class="pane-head gallery-head">
            <span id="gallery-title"></span>
            <input id="gallery-search" type="text" placeholder="search" spellcheck="false" autocomplete="off" />
            <span class="pane-actions">
            <span class="view-switch" role="group" aria-label="view">
              <button class="icon js-view" data-view="list" title="list view (ctrl+1)" aria-label="list view"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4h8M5.5 8h8M5.5 12h8"/><path d="M2.5 4h.5M2.5 8h.5M2.5 12h.5"/></svg></button>
              <button class="icon js-view" data-view="grid" title="gallery view (ctrl+2)" aria-label="gallery view"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg></button>
            </span>
            <button class="icon js-new-note" title="new note (ctrl+n)" aria-label="new note"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
          </span>
          </header>
          <div id="gallery-grid"></div>
          <div class="trash-foot" hidden><span>notes here are deleted for good after 30 days</span><button class="ghost danger js-empty-trash">delete all forever</button></div>
        </section>
        <footer id="footer">
          <span id="note-meta"></span>
          <span id="statsbar" title="typing stats (click for more)"></span>
        </footer>
      </main>
    </div>

    <div id="toast" hidden></div>
    <div id="stats-view" hidden tabindex="-1"></div>

    <div id="palette" hidden>
      <div class="palette-box">
        <input type="text" spellcheck="false" autocomplete="off" />
        <ul class="palette-list"></ul>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
