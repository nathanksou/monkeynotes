<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#323437" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>monkeynotes</title>
  </head>
  <body>
    <div id="app">
      <aside id="folders" class="pane">
        <header class="pane-head">
          <span class="brand"><span class="accent">monkey</span>notes</span>
          <button id="hide-folders" class="icon pane-toggle" title="hide folders" aria-label="hide folders"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/><path d="M10.5 6 8.5 8l2 2"/></svg></button>
        </header>
        <ul id="folder-list" class="list"></ul>
        <div class="pane-foot">
          <button id="new-folder" class="ghost" title="new folder (ctrl+shift+n)">+ new folder</button>
        </div>
      </aside>

      <section id="notes" class="pane">
        <header class="pane-head">
          <span id="notes-title"></span>
          <span class="pane-actions">
            <button id="new-note" class="icon" title="new note (ctrl+n)">+</button>
            <button id="hide-notes" class="icon pane-toggle" title="hide notes list" aria-label="hide notes list"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/><path d="M10.5 6 8.5 8l2 2"/></svg></button>
          </span>
        </header>
        <div class="search-wrap">
          <input id="search" type="text" placeholder="search" spellcheck="false" autocomplete="off" />
        </div>
        <ul id="note-list" class="list"></ul>
      </section>

      <main id="main">
        <div id="topbar">
          <span class="show-panes">
            <button id="show-folders" class="ghost show-pane" title="show folders">folders</button>
            <button id="show-notes" class="ghost show-pane" title="show notes list">notes</button>
          </span>
          <button id="open-palette" class="ghost" title="command line (esc)">esc</button>
        </div>
        <div id="find" hidden>
          <input type="text" placeholder="find in note" spellcheck="false" autocomplete="off" />
          <span class="find-count"></span>
          <button class="find-prev ghost" title="previous (shift+enter)">&uarr;</button>
          <button class="find-next ghost" title="next (enter)">&darr;</button>
          <button class="find-close ghost" title="close (esc)">&times;</button>
        </div>
        <div id="scroller">
          <div id="page">
            <div id="wrap">
              <div id="decor" class="text" aria-hidden="true"></div>
              <div id="highlights" class="text" aria-hidden="true"></div>
              <textarea id="editor" class="text" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="note"></textarea>
              <div class="mirror text" aria-hidden="true"></div>
              <div class="caret hidden smooth"></div>
              <div id="fx" aria-hidden="true"></div>
            </div>
            <div class="empty-hint">no note selected · <kbd>ctrl</kbd> + <kbd>n</kbd> to start one</div>
          </div>
        </div>
        <footer id="footer">
          <span id="note-meta"></span>
          <span id="statsbar" title="typing stats (click for more)"></span>
        </footer>
      </main>
    </div>

    <div id="toast" hidden></div>
    <div id="stats-view" hidden></div>

    <div id="palette" hidden>
      <div class="palette-box">
        <input type="text" spellcheck="false" autocomplete="off" />
        <ul class="palette-list"></ul>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
