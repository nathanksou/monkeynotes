[package]
name = "monkeynotes"
version = "0.4.2"
description = "A minimal, distraction-free notes app with a typing-test aesthetic."
authors = ["Nathan Sou"]
license = "GPL-3.0-or-later"
repository = "https://github.com/nathanksou/monkeynotes"
homepage = "https://github.com/nathanksou/monkeynotes"
edition = "2021"

[lib]
name = "monkeynotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
