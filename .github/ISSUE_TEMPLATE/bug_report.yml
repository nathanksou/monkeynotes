name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. create a note called "ideas"
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: monkeynotes version
      description: Type `check for updates` in the command line (esc) to see it.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Did you lose any text?
      description: If so, check `version history` in the command line first; older versions of each note are kept.
      options:
        - "No"
        - "Yes"
